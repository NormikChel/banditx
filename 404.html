<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — не найдено</title>
<script>
(function () {
  try {
    var p = location.pathname;
    // /path/ → /path  (голый / не трогаем)
    if (p.length > 1 && p.slice(-1) === '/') {
      location.replace(p.slice(0, -1) + location.search + location.hash);
      return;
    }
    // на всякий: /path.html → /path
    if (p.length >= 5 && p.slice(-5) === '.html') {
      var c = p.slice(0, -5);
      if (c.length >= 6 && c.slice(-6) === '/index') c = c.slice(0, -6) || '/';
      location.replace(c + location.search + location.hash);
      return;
    }
  } catch (e) {}
})();
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; text-align: center; padding: 24px;
    background: #f8f8f8; color: #222;
    font: 16px/1.5 system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14181c; color: #f0f0f0; }
    a { color: #7aa2ff; }
  }
  h1 { font-size: 64px; margin: 0; letter-spacing: -.04em; }
  p { margin: 8px 0 24px; color: #666; }
  @media (prefers-color-scheme: dark) { p { color: #808080; } }
  a { color: #2d5bff; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Страница не найдена</p>
    <p><a href="/">← На главную</a></p>
  </main>
</body>
</html>
