<script>
/* 1) URL cleanup + cookie-lang redirect */
(function(){try{
  var p=location.pathname;var c=p;
  if(c.length>=5&&c.slice(-5)==='.html'){
    c=c.slice(0,-5);
    if(c.length>=6&&c.slice(-6)==='/index')c=c.slice(0,-6)||'/';
  }
  if(c.length>1&&c.slice(-1)==='/'){c=c.slice(0,-1);}
  if(c!==p){history.replaceState(null,'',c+location.search+location.hash);}
}catch(e){}})();
/* 2) theme */
(function(){try{var t=localStorage.getItem('banditx-theme');if(t==='dark'){document.documentElement.classList.add('dark');}}catch(e){}})();
/* 3) lang from pathname */
(function(){try{
  var isEn=location.pathname.indexOf('/en')===0;
  document.documentElement.lang=isEn?'en':'ru';
  document.documentElement.setAttribute('data-404-lang',isEn?'en':'ru');
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',document.documentElement.classList.contains('dark')?'#14181c':'#f8f8f8');
}catch(e){}})();
</script>
<style>
.nf-page{
  width:min(calc(1400px + 2*var(--page-pad,40px)), 100%);
  margin:0 auto;
  padding:clamp(72px, 10vw, 140px) var(--page-pad,40px) clamp(80px, 10vw, 140px);
  min-height:60vh;display:grid;place-items:center;text-align:center;
}
.nf-inner{max-width:640px}
.nf-num{
  font-family:var(--font-head, inherit);
  font-size:clamp(88px, 15vw, 176px);
  line-height:.85;letter-spacing:-.05em;margin:0 0 20px;color:var(--ink, #222);
}
.nf-msg{
  color:var(--meta, #666);
  font-size:clamp(15px, 1.35vw, 19px);
  line-height:1.55;margin:0 auto 32px;
}
.nf-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:12px 24px;border-radius:14px;
  background:var(--blue, #2d5bff);color:#fff;text-decoration:none;
  font-family:var(--font-label, inherit);font-size:15px;font-weight:500;
  transition:background-color .12s;
}
.nf-btn:hover{background:var(--blue-readable, #1d43cc)}
html[data-404-lang="ru"] .nf-en{display:none!important}
html[data-404-lang="en"] .nf-ru{display:none!important}
</style>

<body>

<script>
(function(){
  var isEn = document.documentElement.lang === 'en';
  var main = document.querySelector('main');
  var body = document.body;

  function mount(tplId, insertBefore, appendAtEnd) {
    var tpl = document.getElementById(tplId);
    if (!tpl || !tpl.content) return null;
    var frag = document.importNode(tpl.content, true);
    if (insertBefore) body.insertBefore(frag, insertBefore);
    else if (appendAtEnd) body.appendChild(frag);
    return frag;
  }

  mount(isEn ? 'tpl-nav-en' : 'tpl-nav-ru', main, false);
  mount(isEn ? 'tpl-foot-en' : 'tpl-foot-ru', null, true);

  // Theme toggle
  var themeBtns = document.querySelectorAll('nav button[class*="__theme"], nav button[aria-label*="тему"], nav button[aria-label*="theme"]');
  themeBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      var root = document.documentElement;
      var isDark = root.classList.toggle('dark');
      try { localStorage.setItem('banditx-theme', isDark ? 'dark' : 'light'); } catch(e){}
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', isDark ? '#14181c' : '#f8f8f8');
    });
  });

  // Языковая кнопка в доке: пусть ведёт на главную другого языка
  var langLink = document.querySelector('nav a[class*="__lang"], nav a[class*="lang"]');
  if (langLink) langLink.setAttribute('href', isEn ? '/' : '/en');

  // Снимаем активный класс (404 — не раздел)
  document.querySelectorAll('nav [class*="__active"]').forEach(function(el){
    el.className = String(el.className).split(/s+/).filter(function(c){
      return c.indexOf('__active') === -1;
    }).join(' ');
  });
})();
</script>
</body>
