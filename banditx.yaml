server:
  listen: "127.0.0.1:8080"
  tls_listen: "127.0.0.1:8443"

routes:
  - prefix: "/php/"
    upstream: "127.0.0.1:9000"
    kind: fastcgi
    doc_root: "C:/php/www"

  - prefix: "/api/"
    upstream: "127.0.0.1:9000"
    kind: fastcgi
    doc_root: "C:/php/www"

  - prefix: "/"
    upstream: "127.0.0.1:8000"