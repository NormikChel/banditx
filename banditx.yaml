server:
  listen: "127.0.0.1:8080"
  tls_listen: "127.0.0.1:8443"
  access_log:
    path: "access.log"
    format: combined

routes:
  - prefix: "/static/"
    static_root: "C:/Users/Normi_vuaosd7/testbackend/static"

  - prefix: "/php/"
    upstreams:
      - "127.0.0.1:9000"
    strategy: round_robin
    kind: fastcgi
    doc_root: "C:/php/www"

  - prefix: "/"
    upstreams:
      - "127.0.0.1:8000"
      - "127.0.0.1:8001"
    strategy: least_conn